<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>或世盗 RPG｜PC・スマホ同時確認</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#02050d;color:#e9f4ff;font-family:system-ui,"Noto Sans JP",sans-serif;overflow:hidden}body{display:grid;grid-template-rows:58px minmax(0,1fr);background:radial-gradient(circle at 60% 30%,#11356b55,transparent 42%),#02050d}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 18px;border-bottom:1px solid #167acc;background:#030a18}header div{display:grid}header b{font-size:14px;letter-spacing:.08em}header span{font-size:10px;color:#56cfff}header a{padding:8px 12px;color:#eaf8ff;text-decoration:none;font-size:11px;border:1px solid #278dd1;background:#08284b}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,430px);gap:16px;min-height:0;padding:14px;overflow:hidden}section{position:relative;min-width:0;min-height:0;padding-top:25px}section>strong{position:absolute;z-index:3;top:0;left:0;font:800 10px Cinzel,serif;letter-spacing:.14em;color:#62c8ff}.desktop{border:1px solid #185a91;background:#000;box-shadow:0 15px 50px #000,0 0 25px #096fcc33;overflow:hidden}.desktop iframe{display:block;width:100%;height:100%;border:0}.mobile{display:grid;place-items:center;overflow:hidden}.stage{position:relative;flex:none}.phone{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:left top;border:8px solid #0a1425;border-radius:30px;background:#000;box-shadow:0 0 0 1px #338fd1,0 22px 60px #000,0 0 35px #096fcc55;overflow:hidden}.phone:before{content:"";position:absolute;z-index:2;left:50%;top:5px;translate:-50%;width:88px;height:16px;border-radius:0 0 12px 12px;background:#0a1425;pointer-events:none}.phone iframe{display:block;width:100%;height:100%;border:0;background:#01030a}@media(max-width:900px){main{grid-template-columns:1fr}.desktop{display:none}.mobile{display:grid}header{padding-inline:10px}header a{display:none}}
</style></head><body><header><div><b>DUAL PREVIEW</b><span>左：PC ／ 右：SMARTPHONE 390 × 844（どちらも操作可能）</span></div><a href="./?v=mobile-preview-024" target="_blank">通常表示を開く</a></header><main><section class="desktop"><strong>PC PREVIEW</strong><iframe title="或世盗 RPG PC表示" src="./?v=mobile-preview-024"></iframe></section><section class="mobile"><strong>SMARTPHONE 390 × 844</strong><div class="stage"><div class="phone"><iframe title="或世盗 RPG スマホ表示" src="./?v=mobile-preview-024"></iframe></div></div></section></main><script>const stage=document.querySelector('.stage'),phone=document.querySelector('.phone'),mobile=document.querySelector('.mobile');function fit(){const scale=Math.min((mobile.clientWidth-12)/390,(mobile.clientHeight-38)/844,1);stage.style.width=`${390*scale}px`;stage.style.height=`${844*scale}px`;phone.style.transform=`scale(${scale})`}addEventListener('resize',fit);fit();</script></body></html>
